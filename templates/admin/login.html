<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlim - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Birthstone&family=Cause:wght@100..900&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Imperial+Script&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Monsieur+La+Doulaise&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0A0A0A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            display: flex;
            background: #FFFFFF;
            border-radius: 24px;
            overflow: hidden;
            max-width: 80%;
            width: 70%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .login-form-side {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .login-image-side {
            flex: 1;
        }

        .login-image-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            min-height: 450px;
            padding: 30px;
            border-radius: 50px;
        }

        .login-form-side h2 {
            color: #0A0A0A;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-form-side p.subtexto {
            color: #777;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .login-form-side label {
            display: block;
            font-size: 13px;
            color: #333;
            margin-top: 14px;
            margin-bottom: 4px;
        }

        .login-form-side input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .login-form-side button {
            width: 100%;
            margin-top: 22px;
            padding: 11px;
            background: #0A0A0A;
            color: #c7a95c;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .login-form-side button:hover {
            background: #c7a95c;
            color: white;
        }

        .login-footer {
            text-align: center;
            color: #999;
            font-size: 11px;
            margin-top: 20px;
        }

        .error {
            color: #c0392b;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        /* En celular: se oculta la imagen, solo queda el formulario (como tu referencia de la derecha) */
        @media (max-width: 700px) {
            .login-image-side {
                display: none;
            }

            .login-container {
                border-radius: 16px;
                width: 100%;
                max-width: 100%;
            }

            .login-form-side {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-form-side">
            <div style="width: 100%; max-width: 400px;">
                <h2>Bienvenida de nuevo</h2>
                <p class="subtexto">Hoy es un nuevo día para endulzar celebraciones. Inicia sesión para gestionar Vlim.
                </p>

                <form method="POST" style="text-align: left;">
                    <label>Usuario</label>
                    <input type="text" name="usuario" required>

                    <label>Contraseña</label>
                    <input type="password" name="password" required>

                    <button type="submit">Iniciar sesión</button>
                </form>

                {% if error %}
                <p class="error">{{ error }}</p>
                {% endif %}

                <p class="login-footer">© 2026 Vlim — Panel Administrativo</p>
            </div>
        </div>

        <div class="login-image-side">
            <img src="/static/img/sitio/login.jfif" alt="Vlim">
        </div>
    </div>
</body>

</html>
